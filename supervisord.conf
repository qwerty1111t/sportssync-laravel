[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
process_name=%(program_name)s
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.d/www.conf
autostart=true
autorestart=true
numprocs=1
user=root
priority=100
startsecs=5
stopasgroup=true
stderr_logfile=/var/log/php-fpm.err.log
stdout_logfile=/var/log/php-fpm.out.log

[program:nginx]
process_name=%(program_name)s
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
numprocs=1
user=root
priority=200
startsecs=5
stopasgroup=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

[program:websocket]
process_name=%(program_name)s
directory=/var/www/html/public/ws-server
command=node server.js
autostart=true
autorestart=true
numprocs=1
user=www-data
priority=300
environment=WS_PORT=%(ENV_WS_PORT)s,NODE_ENV=production
stderr_logfile=/var/log/websocket.err.log
stdout_logfile=/var/log/websocket.out.log
stopasgroup=true

[group:webservices]
programs=php-fpm,nginx,websocket
priority=999
