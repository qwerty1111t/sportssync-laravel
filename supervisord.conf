[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-serve]
process_name=%(program_name)s_%(process_num)02d
command=bash -c "export PORT=${PORT:-8000} && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
autostart=true
autorestart=true
numprocs=1
user=www-data
stderr_logfile=/var/log/laravel-serve.err.log
stdout_logfile=/var/log/laravel-serve.out.log
stopasgroup=true

[program:npm-dev]
process_name=%(program_name)s_%(process_num)02d
command=bash -c "cd /var/www/html && npm run dev"
autostart=true
autorestart=true
numprocs=1
user=www-data
stderr_logfile=/var/log/npm-dev.err.log
stdout_logfile=/var/log/npm-dev.out.log
stopasgroup=true

[group:webservices]
programs=laravel-serve,npm-dev
priority=999
