[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-serve]
process_name=%(program_name)s_%(process_num)02d
command=bash -c "export PORT=${PORT:-8080} && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
autostart=true
autorestart=true
numprocs=1
user=www-data
stderr_logfile=/var/log/laravel-serve.err.log
stdout_logfile=/var/log/laravel-serve.out.log
stopasgroup=true

[program:websocket]
process_name=%(program_name)s_%(process_num)02d
command=bash -c "cd /var/www/html/public/ws-server && export WS_PORT=${WS_PORT:-3000} && npm start"
autostart=true
autorestart=true
numprocs=1
user=www-data
stderr_logfile=/var/log/websocket.err.log
stdout_logfile=/var/log/websocket.out.log
stopasgroup=true

[group:webservices]
programs=laravel-serve,websocket
priority=999
