[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
process_name=%(program_name)s_%(process_num)02d
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
numprocs=1
user=root
startsecs=10
stopasgroup=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

[program:laravel-serve]
process_name=%(program_name)s_%(process_num)02d
command=bash -c "php artisan serve --host=127.0.0.1 --port=8081"
autostart=true
autorestart=true
numprocs=1
user=www-data
environment=PORT=8081,DB_HOST=%(ENV_DB_HOST)s,DB_PORT=%(ENV_DB_PORT)s,DB_DATABASE=%(ENV_DB_DATABASE)s,DB_USERNAME=%(ENV_DB_USERNAME)s,DB_PASSWORD=%(ENV_DB_PASSWORD)s,DB_CONNECTION=%(ENV_DB_CONNECTION)s,APP_ENV=%(ENV_APP_ENV)s,APP_DEBUG=%(ENV_APP_DEBUG)s
stderr_logfile=/var/log/laravel-serve.err.log
stdout_logfile=/var/log/laravel-serve.out.log
stopasgroup=true

[program:websocket]
process_name=%(program_name)s_%(process_num)02d
command=bash -c "cd /var/www/html/public/ws-server && npm start"
autostart=true
autorestart=true
numprocs=1
user=www-data
environment=WS_PORT=%(ENV_WS_PORT)s,NODE_ENV=production
stderr_logfile=/var/log/websocket.err.log
stdout_logfile=/var/log/websocket.out.log
stopasgroup=true

[group:webservices]
programs=nginx,laravel-serve,websocket
priority=999
