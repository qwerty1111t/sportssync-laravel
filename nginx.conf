user www-data;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" uri="$uri" document_root="$document_root"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream PHP-FPM with timeout handling
    upstream php_fpm {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    # Main server block (listens on port 80, Railway handles TLS)
    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php index.html index.htm;

        # Error pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 500 "Service temporarily unavailable. PHP-FPM may not be running.";
            add_header Content-Type text/plain;
        }

        # Serve favicon without routing to PHP
        location = /favicon.ico {
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        # Serve robots.txt without routing to PHP
        location = /robots.txt {
            try_files $uri =404;
            access_log off;
        }

        # Static files: css, js, images, fonts
        location ~* ^/(?:css|js|images|fonts|build)/(.*)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # CRITICAL: Admin UI static files MUST be served directly (before generic admin locations)
        # Serve CSS, JS, images, JSON from admin UI directories WITHOUT authentication
        location ~ ^/(badminton-admin|basketball-admin|volleyball-admin|tabletennis-admin|darts-admin)/.*\.(css|js|json|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # CRITICAL: Admin UI locations MUST come before catch-all / location
        # NEW: Use hyphenated routes (no spaces) to avoid Railway security blocks
        location /badminton-admin {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location /basketball-admin {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location /darts-admin {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location /tabletennis-admin {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location /volleyball-admin {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location /analytics {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Pass PHP files to php-fpm
        location ~ \.php$ {
            fastcgi_pass php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffering off;
            fastcgi_request_buffering off;
        }

        # Laravel-specific: pass index.php for all other requests
        # This must come AFTER specific admin locations
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # WebSocket proxy for Node.js
        location /ws {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
